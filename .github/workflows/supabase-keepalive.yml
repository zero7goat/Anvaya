# Keeps the Supabase project active on the free plan, which pauses projects after about
# a week without activity. Once a day it reads one product, as a shopper's visit does
# (read-only, through the public API with the publishable key; nothing is written).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 the project URL, as in .env.local
#   SUPABASE_PUBLISHABLE_KEY     the publishable key (sb_publishable_...), as in .env.local
# Run it by hand any time from the Actions tab ("Run workflow"). A failed run (for example
# when the project is already paused) shows in red there and GitHub emails the owner.

name: Keep Supabase active

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one product
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase didn't answer normally (HTTP $status). Check the project in the Supabase dashboard; it may be paused."
            exit 1
          fi
